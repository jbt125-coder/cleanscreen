<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2b2b">
<title>Poop Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --body:#bdbdbd;      /* NES controller grey */
  --body-dark:#8e8e8e;
  --face:#1e1e1e;      /* controller black face */
  --red:#d82800;
  --gold:#f8b800;
  --ink:#fcfcfc;
  --pix:'Press Start 2P',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--face);color:var(--ink);font-family:var(--pix);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100%;height:100dvh;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"bar" "stage" "ctrl";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- link bar ---------- */
#bar{grid-area:bar;display:flex;gap:6px;padding:8px;background:var(--face);align-items:center}
#url{flex:1;min-width:0;font:16px -apple-system,system-ui,sans-serif;padding:8px 10px;border:3px solid #000;border-radius:0;
  background:#fcfcfc;color:#000;-webkit-user-select:text;user-select:text}
.chip{font-family:var(--pix);font-size:10px;padding:10px 10px;background:var(--body);color:#000;border:3px solid #000;
  box-shadow:inset -3px -3px 0 var(--body-dark);cursor:pointer;min-width:44px}
.chip:active{box-shadow:inset 3px 3px 0 var(--body-dark)}

/* ---------- stage ---------- */
#stage{grid-area:stage;position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;justify-self:center;align-self:center}
#ytwrap{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#141428 0 4px,#101020 4px 8px)}
#ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#smudges{position:absolute;inset:0;pointer-events:none}
.smudge{position:absolute;border-radius:50%;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:5px 7px;
  font-size:clamp(7px,2.2vw,12px);pointer-events:none;text-shadow:2px 2px 0 #000}
#grimebox{display:flex;align-items:center;gap:6px}
#grimebar{width:clamp(50px,16vw,110px);height:clamp(7px,1.8vw,11px);border:2px solid var(--ink);background:#000;box-shadow:2px 2px 0 #000}
#grimefill{display:block;height:100%;width:0;background:#00a800}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;
  background:rgba(0,0,0,.62);text-align:center;font-size:clamp(7px,2.3vw,13px);line-height:1.7;padding:8px}
#overlay.hide{display:none}
#overlay h1{margin:0;font-size:2.4em;line-height:1.15;color:var(--gold);text-shadow:3px 3px 0 var(--red),5px 5px 0 #000;font-weight:400}
#overlay p{margin:0;text-shadow:2px 2px 0 #000}
#overlay .how{color:#cfcfcf}
#overlay button{font-family:var(--pix);font-size:1.1em;padding:.8em 1.4em;background:var(--red);color:var(--ink);border:3px solid #000;
  box-shadow:inset -3px -3px 0 #8a1800;cursor:pointer}

/* ---------- controller ---------- */
#ctrl{grid-area:ctrl;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;
  background:var(--body);border-top:6px solid #000;box-shadow:inset 0 6px 0 #d8d8d8}
#pad{position:relative;width:150px;height:150px;touch-action:none;flex:none}
.arm{position:absolute;background:var(--face);border-radius:4px}
.arm.up{left:50px;top:0;width:50px;height:56px}
.arm.down{left:50px;bottom:0;width:50px;height:56px}
.arm.left{top:50px;left:0;width:56px;height:50px}
.arm.right{top:50px;right:0;width:56px;height:50px}
.hub{position:absolute;left:50px;top:50px;width:50px;height:50px;background:var(--face)}
.hub::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#2e2e2e}
.arm.on{background:#555}
#right{display:flex;flex-direction:column;align-items:center;gap:14px}
#ab{display:flex;gap:18px;padding:10px 12px;background:#a8a8a8;border-radius:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font-family:var(--pix);touch-action:none;cursor:pointer}
.act b{width:66px;height:66px;border-radius:50%;background:var(--red);border:3px solid #000;box-shadow:inset -4px -4px 0 #8a1800;
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:16px;font-weight:400}
.act.on b{box-shadow:inset 4px 4px 0 #8a1800;transform:translateY(2px)}
.act small{font-size:8px;color:var(--red)}
#btnStart{font-family:var(--pix);font-size:8px;color:var(--red);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;touch-action:none}
#btnStart i{display:block;width:46px;height:14px;border-radius:7px;background:var(--face);border:3px solid #6a6a6a}

/* landscape phone: pad | video | buttons */
@media (orientation:landscape) and (max-height:540px){
  #app{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"bar bar bar" "pad stage btns"}
  #bar{padding:4px 8px}
  .chip{padding:6px 8px}
  #url{padding:5px 8px}
  #ctrl{display:contents}
  #pad{grid-area:pad;align-self:center;margin:0 10px;width:130px;height:130px}
  .arm.up,.arm.down{left:43px;width:44px;height:48px}
  .arm.left,.arm.right{top:43px;width:48px;height:44px}
  .hub{left:43px;top:43px;width:44px;height:44px}
  #right{grid-area:btns;align-self:center;margin:0 10px}
  #ab{flex-direction:column-reverse;gap:10px;background:none;padding:0}
  .act b{width:58px;height:58px}
  #stage{height:100%;width:auto;max-width:100%}
}
@media (prefers-reduced-motion:reduce){.act.on b{transform:none}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste a YouTube link">
    <button class="chip" id="load">LOAD</button>
    <button class="chip" id="pp" aria-label="Play or pause video">▶</button>
    <button class="chip" id="mute" aria-label="Mute or unmute video">SND</button>
  </div>

  <div id="stage">
    <div id="ytwrap"><div id="yt"></div></div>
    <div id="smudges"></div>
    <canvas id="cv" width="256" height="144"></canvas>
    <div id="hud">
      <span id="score">0</span>
      <div id="grimebox"><span>GRIME</span><div id="grimebar"><i id="grimefill"></i></div></div>
    </div>
    <div id="overlay"></div>
  </div>

  <div id="ctrl">
    <div id="pad" aria-label="Direction pad">
      <div class="arm up"></div><div class="arm down"></div><div class="arm left"></div><div class="arm right"></div><div class="hub"></div>
    </div>
    <div id="right">
      <div id="ab">
        <button class="act" id="btnB"><b>B</b><small>WIPE</small></button>
        <button class="act" id="btnA"><b>A</b><small>SPRAY</small></button>
      </div>
      <button id="btnStart"><i></i>START</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 256, H = 144, GROUND = 140, TOPY = 34, LADDER_TOP = 16;
const GAMEOVER_COVER = 0.25;           // 25% of screen blurry = game over
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
};

const cv = $('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const smudgeLayer = $('smudges'), overlay = $('overlay');

/* ================= SPRITES ================= */
const PAL = { k:'#000000', r:'#d82800', s:'#fcb878', b:'#2038ec', y:'#f8d878', n:'#7c3800', h:'#7c3800',
              w:'#fcfcfc', g:'#a4a4b4', o:'#f87800' };
function makeSprite(rows){
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } }));
  return c;
}
function flip(c){
  const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
  const x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f;
}
function pair(rows){ const r = makeSprite(rows); return { r, l: flip(r) }; }
const TOP = ["..rrrr..",".rrrrrrr","..sssks.","..sssss.","...ss...",".bbbbbb.","sbbybbbs","s.bbbb.s","..bbbb.."];
const SP = {
  stand: pair(TOP.concat(["..b..b..","..b..b..",".nn..nn."])),
  walk1: pair(TOP.concat(["..b..b..",".b....b.","nn....nn"])),
  walk2: pair(TOP.concat(["...bb...","...bb...","..nnn..."])),
  climb: pair(["..rrrr..",".rrrrrr.","..hhhh..","..hhhh..","...ss...","sbbbbbbs","sbbbbbbs","..bbbb..","..bbbb..","..b..b..","..b..b..",".nn..nn."]),
  birdA: pair([".ww.......","..ww...gg.","...wggggko","..gggggg..","...gggg...","....oo...."]),
  birdB: pair(["..........",".......gg.","...gggggko","..wwgggg..",".ww.ggg...","....oo...."])
};

function makePoopImg(r){
  const S = Math.ceil(r * 2.6), c = document.createElement('canvas');
  c.width = S; c.height = S + 10;
  const x = c.getContext('2d'), cx = S / 2, cy = S / 2;
  const lobes = [];
  for (let i = 0; i < 4; i++) lobes.push([2 + Math.floor(Math.random() * 4), Math.random() * 6.28, rand(.05, .14)]);
  const rad = a => r * (0.8 + lobes.reduce((s, [k, p, amp]) => s + amp * Math.sin(k * a + p), 0));
  const bottom = new Array(S).fill(-1);
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const dx = i + .5 - cx, dy = j + .5 - cy, d = Math.hypot(dx, dy), R = rad(Math.atan2(dy, dx));
    if (d < R) {
      let col;
      if (d < R * .36) col = Math.random() < .3 ? '#7a5a30' : '#4a3418';
      else if (d > R - 1.3) col = '#b4b4bc';
      else col = Math.random() < .12 ? '#d0d0d8' : '#f8f8f8';
      x.fillStyle = col; x.fillRect(i, j, 1, 1);
      bottom[i] = j;
    }
  }
  const nd = 1 + Math.floor(Math.random() * 3);
  for (let k = 0; k < nd; k++) {
    const i = Math.floor(cx + rand(-r * .55, r * .55));
    if (bottom[i] < 0) continue;
    const L = 3 + Math.floor(Math.random() * 6);
    x.fillStyle = '#ececf0'; x.fillRect(i, bottom[i], 1, L); x.fillRect(i - 1, bottom[i] + L - 1, 2, 2);
  }
  x.fillStyle = '#f8f8f8';
  for (let k = 0; k < 7; k++) {
    const a = Math.random() * 6.28, d = r * rand(1.0, 1.25);
    x.fillRect(Math.floor(cx + Math.cos(a) * d), Math.floor(cy + Math.sin(a) * d), 1, 1);
  }
  return c;
}

/* ================= AUDIO ================= */
let AC = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', vol = .06, slide = 0, delay = 0){
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function hiss(d, vol = .05, freq = 3000){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  splat(){ hiss(.18, .09, 300); tone(160, .18, 'square', .06, -110); },
  spray(){ hiss(.2, .05, 3500); },
  wipe(){ tone(900, .09, 'triangle', .07, 500); },
  smear(){ tone(220, .1, 'square', .04, -60); },
  clean(){ [660, 880, 1320].forEach((f, i) => tone(f, .1, 'square', .05, 0, i * .07)); },
  clank(){ tone(240, .07, 'square', .06); tone(360, .06, 'square', .05, 0, .05); },
  tweet(){ tone(2200, .05, 'square', .025, 600); tone(2400, .05, 'square', .025, 500, .08); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .2, 'square', .06, 0, i * .18)); }
};

/* ================= STATE ================= */
let state = 'title';       // title | play | pause | over
let T, score, spawnT, man, birds, drops, poops, parts, popups, grime;
let best = +(store.get('poopPatrolBest') || 0);

function reset(){
  T = 0; score = 0; spawnT = 1.5; grime = 0;
  man = { x: 128, y: GROUND, face: 1, mode: 'carry', lx: 128, t: 0, anim: 0, moving: false, action: null, actT: 0 };
  birds = []; drops = []; parts = []; popups = [];
  if (poops) poops.forEach(p => p.el.remove());
  poops = [];
  updateHud();
}

/* ================= INPUT ================= */
const keys = new Set();
let padDir = null;
const gp = { up:false, down:false, left:false, right:false };
let gpPrev = { a:false, b:false, s:false };
function held(d){
  return padDir === d || gp[d] ||
    (d === 'up' && (keys.has('ArrowUp') || keys.has('KeyW'))) ||
    (d === 'down' && (keys.has('ArrowDown') || keys.has('KeyS'))) ||
    (d === 'left' && (keys.has('ArrowLeft') || keys.has('KeyA'))) ||
    (d === 'right' && (keys.has('ArrowRight') || keys.has('KeyD')));
}
addEventListener('keydown', e => {
  if (document.activeElement === $('url')) return;
  if (e.repeat) { if (e.code.startsWith('Arrow')) e.preventDefault(); return; }
  keys.add(e.code);
  if (['KeyZ','KeyJ','Space'].includes(e.code)) pressA();
  if (['KeyX','KeyK'].includes(e.code)) pressB();
  if (['Enter','KeyP'].includes(e.code)) pressStart();
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// touch D-pad (slide your thumb between directions)
const pad = $('pad'), arms = {};
['up','down','left','right'].forEach(d => arms[d] = pad.querySelector('.' + d));
function setPad(d){ padDir = d; for (const k in arms) arms[k].classList.toggle('on', k === d); }
function padFrom(e){
  const r = pad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < 12) return setPad(null);
  setPad(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'));
}
pad.addEventListener('pointerdown', e => { e.preventDefault(); ac(); pad.setPointerCapture(e.pointerId); padFrom(e); });
pad.addEventListener('pointermove', e => { if (pad.hasPointerCapture(e.pointerId)) padFrom(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => pad.addEventListener(ev, () => setPad(null)));

function bindBtn(el, fn){
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('on'); fn(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('on')));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn($('btnA'), () => pressA());
bindBtn($('btnB'), () => pressB());
bindBtn($('btnStart'), () => pressStart());

// Bluetooth / MFi controller (Gamepad API, standard mapping)
function pollGamepad(){
  gp.up = gp.down = gp.left = gp.right = false;
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let g = null; for (const x of list) if (x) { g = x; break; }
  if (!g) return;
  const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
  const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
  gp.up = b(12) || ay < -.5; gp.down = b(13) || ay > .5;
  gp.left = b(14) || ax < -.5; gp.right = b(15) || ax > .5;
  const a = b(0), w = b(1) || b(2), s = b(9) || b(8);
  if (a && !gpPrev.a) pressA();
  if (w && !gpPrev.b) pressB();
  if (s && !gpPrev.s) pressStart();
  gpPrev = { a, b: w, s };
}

/* ================= ACTIONS ================= */
function hand(){
  const mx = man.mode === 'ladder' ? man.lx : man.x;
  return { x: mx + man.face * 6, y: man.y - 7 };
}
function inReach(){
  const h = hand();
  return poops.filter(p => Math.hypot(p.x - h.x, p.y - h.y) < p.r + 10);
}
function pressA(){
  ac();
  if (state === 'title' || state === 'over') return startGame();
  if (state !== 'play' || man.actT > 0 || man.mode === 'throw') return;
  man.action = 'spray'; man.actT = .22; sfx.spray();
  const h = hand();
  for (let i = 0; i < 10; i++) parts.push({ x: h.x, y: h.y - 2, vx: man.face * rand(50, 110), vy: rand(-25, 25), g: 0, life: rand(.2, .35), c: '#9cd8fc' });
  for (const p of inReach()) { p.wet = Math.min(3, p.wet + 1); updSmudge(p); }
}
function pressB(){
  ac();
  if (state !== 'play' || man.actT > 0 || man.mode === 'throw') return;
  man.action = 'wipe'; man.actT = .22;
  const hits = inReach();
  if (!hits.length) { sfx.wipe(); return; }
  let wetHit = false;
  for (const p of hits) {
    if (p.wet > 0) {
      p.wet--; p.dirt -= 25; score += 10; wetHit = true;
      for (let i = 0; i < 4; i++) parts.push({ x: p.x + rand(-p.r, p.r) * .6, y: p.y + rand(-p.r, p.r) * .6, vx: rand(-15, 15), vy: rand(-30, 0), g: 140, life: .45, c: Math.random() < .5 ? '#f8f8f8' : '#7a5a30' });
    } else {
      // dry wipe smears it bigger
      p.dirt -= 4; p.r = Math.min(p.r0 * 1.6, p.r + .9);
    }
    if (p.dirt <= 0) cleanPoop(p); else updSmudge(p);
  }
  wetHit ? sfx.wipe() : sfx.smear();
  updateHud();
}
function cleanPoop(p){
  poops.splice(poops.indexOf(p), 1); p.el.remove();
  score += 100; sfx.clean();
  const words = ['CLEAN!', 'SHINY!', 'SPOTLESS!', 'SPARKLY!'];
  popups.push({ x: p.x, y: p.y, text: words[Math.floor(Math.random() * words.length)], life: 1 });
  popups.push({ x: p.x, y: p.y + 10, text: '+100', life: 1 });
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * 6.28;
    parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, g: 0, life: .5, c: i % 2 ? '#fcfc78' : '#fcfcfc' });
  }
}
function pressStart(){
  ac();
  if (state === 'title' || state === 'over') startGame();
  else if (state === 'play') setPause(true);
  else if (state === 'pause') setPause(false);
}

/* ================= POOPS ================= */
function newPoop(x, y){
  const r = rand(8, 13), img = makePoopImg(r);
  const el = document.createElement('div'); el.className = 'smudge'; smudgeLayer.appendChild(el);
  const p = { x, y, r, r0: r, dirt: 100, wet: 0, img, S: img.width, el, seed: Math.random() * 6.28 };
  poops.push(p); updSmudge(p);
  for (let i = 0; i < 8; i++) parts.push({ x, y, vx: rand(-70, 70), vy: rand(-70, 40), g: 120, life: .35, c: '#f8f8f8' });
}
function updSmudge(p){
  const R = p.r * 1.15, s = p.el.style, k = Math.max(0, p.dirt) / 100;
  s.left = ((p.x - R) / W * 100) + '%'; s.top = ((p.y - R) / H * 100) + '%';
  s.width = (2 * R / W * 100) + '%'; s.height = (2 * R / H * 100) + '%';
  const bl = 'blur(' + (2 + k * 7).toFixed(1) + 'px)';
  s.webkitBackdropFilter = bl; s.backdropFilter = bl;
  s.background = p.wet > 0 ? `rgba(130,180,240,${(.16 + p.wet * .07).toFixed(2)})` : `rgba(150,130,80,${(.1 + k * .22).toFixed(2)})`;
}

const GW = 64, GH = 36, grid = new Uint8Array(GW * GH);
function coverage(){
  grid.fill(0); let n = 0;
  for (const p of poops) {
    const R = p.r * 1.15;
    const x0 = Math.max(0, Math.floor((p.x - R) / 4)), x1 = Math.min(GW - 1, Math.floor((p.x + R) / 4));
    const y0 = Math.max(0, Math.floor((p.y - R) / 4)), y1 = Math.min(GH - 1, Math.floor((p.y + R) / 4));
    for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
      const cx = i * 4 + 2, cy = j * 4 + 2, idx = j * GW + i;
      if (!grid[idx] && (cx - p.x) ** 2 + (cy - p.y) ** 2 <= R * R) { grid[idx] = 1; n++; }
    }
  }
  return n / (GW * GH);
}

/* ================= BIRDS ================= */
function spawnBird(){
  const dir = Math.random() < .5 ? 1 : -1;
  const ds = [rand(24, 232)];
  if (T > 60 && Math.random() < .3) ds.push(rand(24, 232));
  ds.sort((a, b) => dir * (a - b));
  birds.push({ x: dir > 0 ? -12 : W + 12, y: rand(8, 22), dir, sp: rand(45, 72), drops: ds, f: Math.random() * 2 });
  sfx.tweet();
}

/* ================= UPDATE ================= */
function update(dt){
  T += dt;
  const up = held('up'), down = held('down'), left = held('left'), right = held('right');
  const m = man;
  m.actT = Math.max(0, m.actT - dt);
  m.moving = false;

  if (m.mode === 'carry') {
    const mv = left ? -1 : right ? 1 : 0;
    if (mv) { m.face = mv; m.x = clamp(m.x + mv * 62 * dt, 10, W - 10); m.anim += dt * 10; m.moving = true; }
    if (up) { m.mode = 'throw'; m.t = 0; m.lx = m.x; sfx.clank(); }
  } else if (m.mode === 'throw') {
    m.t += dt; if (m.t >= .35) m.mode = 'ladder';
  } else {
    const mv = up ? -1 : down ? 1 : 0;
    if (mv) { m.y = clamp(m.y + mv * 58 * dt, TOPY, GROUND); m.anim += dt * 8; m.moving = true; }
    if (left || right) {
      const f = left ? -1 : 1;
      if (!mv && m.y >= GROUND - .5) { m.mode = 'carry'; m.x = m.lx; m.face = f; sfx.clank(); }
      else m.face = f;
    }
  }

  spawnT -= dt;
  if (spawnT <= 0) { spawnBird(); spawnT = Math.max(1.1, 4.2 - T * .018) * rand(.8, 1.2); }

  for (const b of birds) {
    b.x += b.dir * b.sp * dt; b.f += dt * 8;
    if (b.drops.length && (b.dir > 0 ? b.x >= b.drops[0] : b.x <= b.drops[0])) {
      b.drops.shift();
      drops.push({ x: b.x, y0: b.y + 4, y: b.y + 4, ty: rand(32, 126), t: 0 });
    }
  }
  birds = birds.filter(b => b.x > -20 && b.x < W + 20);

  for (const d of drops) {
    d.t += dt; d.y = d.y0 + (d.ty - d.y0) * Math.min(1, d.t / .5);
    if (d.t >= .5) { d.done = true; newPoop(d.x, d.ty); sfx.splat(); }
  }
  drops = drops.filter(d => !d.done);

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 14 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);

  grime = coverage() / GAMEOVER_COVER;
  updateHud();
  if (grime >= 1) gameOver();
}

/* ================= DRAW ================= */
function drawLadder(x, top){
  x = Math.round(x); top = Math.round(top);
  ctx.fillStyle = '#a05010';
  ctx.fillRect(x - 6, top, 2, H - top); ctx.fillRect(x + 4, top, 2, H - top);
  ctx.fillStyle = '#f0a040';
  ctx.fillRect(x - 6, top, 1, H - top); ctx.fillRect(x + 4, top, 1, H - top);
  for (let y = H - 3; y > top; y -= 6) { ctx.fillStyle = '#c87020'; ctx.fillRect(x - 4, y, 8, 1); }
}
function txt(s, x, y, col = '#fcfcfc'){
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  for (const [ox, oy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]]) ctx.fillText(s, Math.round(x + ox), Math.round(y + oy));
  ctx.fillStyle = col; ctx.fillText(s, Math.round(x), Math.round(y));
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  if (!man) return;

  for (const p of poops) {
    const a = clamp((p.dirt - 35) / 45, 0, 1);
    if (a > 0) { ctx.globalAlpha = a; ctx.drawImage(p.img, Math.round(p.x - p.S / 2), Math.round(p.y - p.S / 2)); ctx.globalAlpha = 1; }
    if (p.wet > 0) {
      ctx.fillStyle = '#7cc8fc';
      for (let k = 0; k < p.wet * 3; k++) {
        const an = p.seed + k * 2.1, d = p.r * .25 * (1 + (k % 3));
        ctx.fillRect(Math.round(p.x + Math.cos(an) * d), Math.round(p.y + Math.sin(an) * d), 1, 2);
      }
    }
  }

  // target brackets on spots within reach
  if (state === 'play' && Math.floor(T * 5) % 2 === 0) {
    ctx.fillStyle = '#fcfc78';
    for (const p of inReach()) {
      const R = Math.round(p.r + 3), x = Math.round(p.x), y = Math.round(p.y);
      for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
        ctx.fillRect(x + sx * R - (sx > 0 ? 2 : 0), y + sy * R, 3, 1);
        ctx.fillRect(x + sx * R, y + sy * R - (sy > 0 ? 2 : 0), 1, 3);
      }
    }
  }

  const m = man;
  if (m.mode === 'throw') {
    const k = Math.min(1, m.t / .35), e = 1 - (1 - k) * (1 - k);
    drawLadder(m.lx, GROUND - 12 - (GROUND - 12 - LADDER_TOP) * e);
  } else if (m.mode === 'ladder') drawLadder(m.lx, LADDER_TOP);

  const mx = m.mode === 'carry' ? m.x : m.lx;
  const ox = Math.round(mx - 4), oy = Math.round(m.y - 12);
  let img;
  if (m.mode === 'ladder') {
    img = (Math.floor(m.anim) % 2) ? SP.climb.l : SP.climb.r;
  } else {
    const s = m.moving ? (Math.floor(m.anim) % 2 ? SP.walk1 : SP.walk2) : SP.stand;
    img = m.face < 0 ? s.l : s.r;
  }
  ctx.drawImage(img, ox, oy);

  if (m.mode === 'carry') {
    ctx.fillStyle = PAL.s; ctx.fillRect(ox, oy - 2, 1, 8); ctx.fillRect(ox + 7, oy - 2, 1, 8);
    ctx.fillStyle = '#c87020'; ctx.fillRect(ox - 9, oy - 5, 26, 1); ctx.fillRect(ox - 9, oy - 1, 26, 1);
    for (let i = 0; i < 26; i += 4) ctx.fillRect(ox - 9 + i, oy - 5, 1, 4);
  }

  if (m.actT > 0) {
    const h = hand(), hx = Math.round(h.x), hy = Math.round(h.y);
    if (m.action === 'spray') {
      ctx.fillStyle = '#a4a4b4'; ctx.fillRect(hx - 1, hy - 3, 3, 5);
      ctx.fillStyle = '#d82800'; ctx.fillRect(hx, hy - 4, 1, 1);
    } else {
      const ph = m.actT * 40;
      ctx.fillStyle = '#f8d878';
      ctx.fillRect(hx - 1 + Math.round(Math.sin(ph) * 3), hy - 2 + Math.round(Math.cos(ph) * 2), 4, 3);
    }
  }

  for (const d of drops) {
    const s = 1 + Math.floor(Math.min(1, d.t / .5) * 4);
    ctx.fillStyle = '#f8f8f8'; ctx.fillRect(Math.round(d.x - s / 2), Math.round(d.y - s / 2), s, s);
    if (s > 2) { ctx.fillStyle = '#4a3418'; ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1); }
  }
  for (const b of birds) {
    const fr = Math.floor(b.f) % 2 ? SP.birdA : SP.birdB;
    ctx.drawImage(b.dir > 0 ? fr.r : fr.l, Math.round(b.x - 5), Math.round(b.y - 3));
  }
  for (const p of parts) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  for (const p of popups) txt(p.text, clamp(p.x, 30, W - 30), p.y, p.text[0] === '+' ? '#fcfc78' : '#fcfcfc');
}

/* ================= HUD / SCREENS ================= */
let lastScore = -1, lastG = -1;
function updateHud(){
  if (score !== lastScore) { $('score').textContent = 'SCORE ' + score; lastScore = score; }
  const g = Math.round(clamp(grime, 0, 1) * 100);
  if (g !== lastG) {
    const f = $('grimefill'); f.style.width = g + '%';
    f.style.background = g < 50 ? '#00a800' : g < 80 ? '#f8b800' : '#d82800';
    lastG = g;
  }
}
function showOverlay(html){ overlay.innerHTML = html; overlay.classList.remove('hide'); const b = overlay.querySelector('button'); if (b) b.onclick = () => pressStart(); }
function titleScreen(){
  showOverlay(`<h1>POOP<br>PATROL</h1>
    <p>Birds are pooping on your show.</p>
    <p class="how">◀ ▶ walk &nbsp; ▲ throw ladder and climb<br>A spray &nbsp; B wipe<br>Spray then wipe each spot about 4 times</p>
    <button>START</button><p class="how">BEST ${best}</p>`);
}
function startGame(){
  reset(); state = 'play'; overlay.classList.add('hide');
  if (ytReady) { try { player.playVideo(); } catch(e){} }
}
function setPause(on){
  if (on) { state = 'pause'; showOverlay(`<h1>PAUSED</h1><button>RESUME</button>`); }
  else { state = 'play'; overlay.classList.add('hide'); }
}
function gameOver(){
  state = 'over'; sfx.over();
  if (score > best) { best = score; store.set('poopPatrolBest', String(best)); }
  showOverlay(`<h1>TOO GRIMY!</h1><p>You can't see the show anymore.</p><p>SCORE ${score}<br>BEST ${best}</p><button>PLAY AGAIN</button>`);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });

/* ================= LOOP ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  pollGamepad();
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ================= YOUTUBE ================= */
const DEFAULT_ID = 'jfKfPfyJRdk';
let player = null, ytReady = false;
let curId = store.get('poopPatrolVideo') || DEFAULT_ID;
function parseId(s){
  s = (s || '').trim();
  const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  if (m) return m[1];
  return /^[\w-]{11}$/.test(s) ? s : null;
}
window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('yt', {
    width: '100%', height: '100%', videoId: curId,
    playerVars: { playsinline: 1, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: e => {
        $('pp').textContent = e.data === 1 ? '❚❚' : '▶';
        if (e.data === 0) { player.seekTo(0); player.playVideo(); }
      }
    }
  });
};
const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);

$('load').onclick = () => {
  const id = parseId($('url').value);
  if (!id) { $('url').value = ''; $('url').placeholder = 'That link has no video ID'; return; }
  curId = id; store.set('poopPatrolVideo', id); $('url').blur();
  if (ytReady) player.loadVideoById(id);
};
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') $('load').click(); });
$('pp').onclick = () => {
  if (!ytReady) return;
  player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
};
$('mute').onclick = () => {
  if (!ytReady) return;
  if (player.isMuted()) { player.unMute(); $('mute').textContent = 'SND'; }
  else { player.mute(); $('mute').textContent = 'OFF'; }
};

reset();
titleScreen();
requestAnimationFrame(frame);
})();
</script>
